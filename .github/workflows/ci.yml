name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A host line can ship *after* this plugin's last release, and nothing in
  # this repository would run `check:peers` until the next commit — which is
  # exactly how #13 slipped through: `dsh-tools@0.2.0-rc.1` published three
  # days after 0.4.0. The daily run turns that into a failing build instead of
  # a user's bug report.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # `lib/` is committed (the plugin is installed from git as often as from
      # npm), so a stale build would ship source that does not match lib/.
      - name: lib/ matches a fresh build
        run: git diff --exit-code -- lib

      - run: npm test

      # Every DSH release is a prerelease, so a peer range stops matching as
      # soon as the host moves to a new line (#4, #12). Fails the day it does.
      - run: npm run check:peers

  newest-host:
    # The compat floor is the devDependency; this job proves the plugin still
    # compiles and passes against the newest published host line.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm install --no-save @deepseek-ai/dsh-tools@next

      - run: npm run typecheck

      - run: npm test
